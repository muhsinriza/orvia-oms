services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       orvia
      POSTGRES_USER:     orvia
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:        production
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_NAME:         orvia
      DB_USER:         orvia
      DB_PASSWORD:     ${DB_PASSWORD}
      SESSION_SECRET:  ${SESSION_SECRET}
      PORT:            3001
    expose:
      - "3001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-orviaoms.com}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
